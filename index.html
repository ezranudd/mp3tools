<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mp3tools</title>
<script>
  // Apply the theme before first paint to avoid a flash. Phones (coarse pointer)
  // follow the device's system light/dark; desktop uses the saved toggle value.
  try {
    var coarse = matchMedia("(hover: none) and (pointer: coarse)").matches;
    document.documentElement.dataset.theme = coarse
      ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
      : (localStorage.getItem("mp3tools-theme") === "light" ? "light" : "dark");
  } catch (e) { document.documentElement.dataset.theme = "dark"; }
</script>
<style>
  :root, :root[data-theme="dark"] {
          --bg:#1e1e2e; --panel:#27293d; --line:#3a3d52; --fg:#e6e6ef;
          --muted:#9aa0b5; --accent:#7aa2f7; --on-accent:#11131f;
          --ok:#9ece6a; --err:#f7768e; --warn:#e0af68; --code-bg:#15161f; }
  :root[data-theme="light"] {
          --bg:#f6f7fb; --panel:#eaecf3; --line:#d3d7e2; --fg:#1d1f2b;
          --muted:#5f6577; --accent:#3b66d6; --on-accent:#ffffff;
          --ok:#2f8a3e; --err:#c33651; --warn:#9a6a00; --code-bg:#eceef4; }
  * { box-sizing: border-box; }
  /* Themed scrollbars (Firefox) */
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  /* Themed scrollbars (WebKit/Blink) */
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--line); border-radius:5px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--muted); }
  ::-webkit-scrollbar-corner { background:transparent; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; color:var(--fg);
         background:var(--bg); height:100vh; height:100dvh;   /* dvh: clears iOS toolbar */
         display:flex; flex-direction:column; }
  /* Customizable full-window background image (foobar-style). */
  #bgLayer { position:fixed; inset:0; z-index:-1; overflow:hidden; display:none; }
  html[data-bg="on"] #bgLayer { display:block; }
  #bgImage { position:absolute; inset:-5%;        /* overscan hides blurred edges */
             background-position:center; background-repeat:no-repeat;
             background-size:var(--bg-fit, cover); filter:blur(var(--bg-blur, 0px)); }
  #bgScrim { position:absolute; inset:0; background:var(--bg);
             opacity:var(--bg-opacity, .4); }
  /* Immersive mode: let the image show through the chrome panels. */
  html[data-bg="on"] body { background:transparent; }
  html[data-bg="on"] header,
  html[data-bg="on"] #tree,
  html[data-bg="on"] .player {
         background:color-mix(in srgb, var(--panel) 78%, transparent);
         backdrop-filter:blur(6px); }
  /* The left menu is more see-through than the other chrome. */
  html[data-bg="on"] nav.sidebar {
         background:color-mix(in srgb, var(--panel) 45%, transparent);
         backdrop-filter:blur(6px); }
  /* Optional: keep text legible over the background image. --bg is the opaque theme
     base, so the halo is dark in dark mode and light in light mode. */
  html[data-bg="on"][data-bg-readable] #detail,
  html[data-bg="on"][data-bg-readable] .page {
         --muted:color-mix(in srgb, var(--fg) 62%, var(--muted));
         text-shadow:0 1px 2px var(--bg), 0 0 3px var(--bg); }
  /* Form-control value text doesn't reliably inherit text-shadow — carry it onto
     the Edit-mode inputs so editable fields keep the same halo. */
  html[data-bg="on"][data-bg-readable] #detail :is(input, textarea, select),
  html[data-bg="on"][data-bg-readable] .page :is(input, textarea, select) {
         text-shadow:inherit; }
  header { padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:12px; flex:0 0 auto;
           position:relative; z-index:30; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .root { color:var(--muted); font-size:12px; }
  .modeToggle { margin-left:auto; display:flex; border:1px solid var(--line);
                border-radius:6px; overflow:hidden; }
  .modeToggle button { border:0; background:transparent; color:var(--muted);
                       font:inherit; line-height:1; padding:5px 14px; cursor:pointer; }
  .modeToggle button.active { background:var(--accent); color:var(--on-accent); font-weight:600; }
  .iconbtn { background:transparent; border:1px solid var(--line); border-radius:6px;
             color:var(--fg); cursor:pointer; padding:5px 10px; font-size:14px; line-height:1; }
  .iconbtn:hover { border-color:var(--accent); }
  /* Mobile-only controls: hidden on desktop, revealed in the phone @media block.
     The search toggle, back button and full-screen search overlay don't exist on
     the desktop layout (which has an inline header search + in-flow back bar). */
  .searchToggle { display:none; font-size:18px; }
  /* Bare, themed glyph button (no native white chrome) — used for the back control. */
  .fab { display:none; background:transparent; border:0; color:var(--fg);
         cursor:pointer; padding:0; font:inherit; line-height:1; }
  .fab:hover { color:var(--accent); }
  #searchOverlay { display:none; }
  /* Header search box + results dropdown */
  .search { position:relative; }
  .search #searchInput { width:240px; }
  .searchresults { position:absolute; top:100%; left:0; margin-top:6px; min-width:320px;
                   max-width:440px; max-height:64vh; overflow:auto; display:none; z-index:35;
                   background:var(--bg); border:1px solid var(--line); border-radius:8px;
                   box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .searchresults.show { display:block; }
  .searchgroup { font-size:11px; color:var(--muted); padding:7px 12px 2px;
                 text-transform:uppercase; letter-spacing:.04em; }
  .searchrow { display:flex; align-items:center; gap:8px; padding:5px 12px; cursor:pointer; }
  .searchrow:hover { background:var(--panel); }
  .searchthumb { width:28px; height:28px; flex:0 0 auto; object-fit:cover;
                 border-radius:4px; background:var(--panel); }
  .searchthumb.noart { visibility:hidden; }
  .searchthumb.glyph { display:flex; align-items:center; justify-content:center;
                       color:var(--muted); overflow:hidden; }
  .searchthumb.glyph svg { width:100%; height:100%; fill:currentColor; }
  .searchrow > span:first-of-type { flex:1; overflow:hidden; text-overflow:ellipsis;
                                    white-space:nowrap; }
  .searchrow > span.muted { flex:0 1 auto; max-width:45%; overflow:hidden;
                            text-overflow:ellipsis; white-space:nowrap; }
  .searchempty { padding:8px 12px; }
  tr.flash { animation:flashrow 1.5s ease; }
  @keyframes flashrow { 0% { background:var(--accent); } 100% { background:transparent; } }
  /* Global running-operation indicator (header) */
  .jobIndicator { display:none; align-items:center; gap:8px; margin-left:18px;
                  font-size:13px; background:var(--panel); border:1px solid var(--line);
                  border-radius:14px; padding:4px 6px 4px 12px; }
  .jobIndicator.show { display:flex; }
  .jobIndicator .dot { width:9px; height:9px; border-radius:50%; background:var(--warn);
                       animation:pulse 1.1s ease-in-out infinite; }
  .jobIndicator .iconbtn { padding:2px 8px; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }
  /* Indeterminate progress bar (job panes) */
  .jobbar { height:4px; border-radius:2px; background:var(--line); overflow:hidden; margin:2px 0 4px; }
  .jobbar > div { width:30%; height:100%; background:var(--accent); border-radius:2px;
                  animation:slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left:-30%; } 100% { margin-left:100%; } }
  /* Determinate variant: width set inline, no animation. */
  .jobbar.det > div { width:0; margin-left:0; animation:none; transition:width .3s ease; }
  /* Read-only notice (e.g. editing paused during an operation) */
  .notice { background:var(--panel); border:1px solid var(--warn); color:var(--warn);
            border-radius:6px; padding:6px 10px; margin-bottom:12px; font-size:13px; }
  /* Bottom player bar */
  .player { display:none; flex:0 0 auto; align-items:center; gap:10px;
            padding:8px 16px; background:var(--panel); border-top:1px solid var(--line); }
  .player.show { display:flex; }
  .player .pbtn { background:transparent; border:0; color:var(--fg); cursor:pointer;
                  font-size:16px; line-height:1; padding:0; width:32px; height:32px;
                  display:inline-flex; align-items:center; justify-content:center;
                  border-radius:6px; }
  .player .pbtn:hover { color:var(--accent); }
  .player .pbtn svg { width:18px; height:18px; display:block; fill:currentColor; }
  .player .palbum { width:32px; height:32px; flex:0 0 auto; object-fit:cover;
                    border-radius:4px; background:var(--panel); cursor:pointer; }
  .player .palbum:hover { outline:1px solid var(--accent); }
  .player .palbum.noart { display:none; }
  .player .ptitle { min-width:160px; max-width:38vw; overflow:hidden; text-overflow:ellipsis;
                    white-space:nowrap; cursor:pointer; }
  .player .ptitle:hover { color:var(--accent); }
  /* The pmeta (title/artist) and pseekrow (cur/seek/dur) wrappers are layout-neutral
     on desktop — display:contents lets their children act as direct flex items, so
     the desktop bar is unchanged. The phone @media block re-flows them. */
  .player .pmeta, .player .pseekrow { display:contents; }
  .player .partist { display:none; }
  .player .ptime { color:var(--muted); font-size:12px; width:38px; text-align:center;
                   font-variant-numeric:tabular-nums; }
  /* Bitrate badge: shown only on mobile, where the browse table's bitrate column
     is dropped. Hidden on desktop (the table already shows it). */
  .player .pbitrate { display:none; flex:0 0 auto; color:var(--muted); font-size:11px;
                      white-space:nowrap; font-variant-numeric:tabular-nums; }
  .player .pseek { flex:1; accent-color:var(--accent); cursor:pointer; }
  .layout { flex:1; display:flex; min-height:0; }
  nav.sidebar { width:150px; flex:0 0 auto; background:var(--panel);
                border-right:1px solid var(--line); padding:8px 0; }
  nav.sidebar button { display:flex; align-items:center; gap:8px; width:100%;
                       text-align:left; border:0; background:transparent;
                       color:var(--fg); padding:8px 14px; cursor:pointer; font:inherit;
                       border-left:3px solid transparent; }
  nav.sidebar button:hover { background:var(--bg); }
  nav.sidebar button.active { border-left-color:var(--accent); color:var(--accent);
                              font-weight:600; }
  .navicon { flex:0 0 auto; width:1.4em; text-align:center; opacity:.75; }
  .navlabel { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  nav.sidebar button.active .navicon { opacity:1; }
  #view { flex:1; min-width:0; display:flex; }

  /* shared widgets */
  button.btn { font:inherit; color:var(--fg); background:var(--panel);
               border:1px solid var(--line); border-radius:5px; padding:6px 12px;
               cursor:pointer; }
  button.btn:hover { border-color:var(--accent); }
  button.btn.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  button.btn.danger { border-color:var(--err); color:var(--err); }
  input, select { font:inherit; color:var(--fg); background:var(--bg);
                  border:1px solid var(--line); border-radius:5px; padding:6px 8px; }
  .muted { color:var(--muted); }
  .ok { color:var(--ok); } .err { color:var(--err); } .warn { color:var(--warn); }

  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
           background:var(--panel); border:1px solid var(--line); padding:8px 16px;
           border-radius:6px; opacity:0; transition:opacity .2s; pointer-events:none;
           z-index:50; }
  .toast.show { opacity:1; }
  .toast.err { border-color:var(--err); color:var(--err); }

  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
           align-items:center; justify-content:center; z-index:40; }
  .modal.show { display:flex; }
  .modal .box { background:var(--bg); border:1px solid var(--line); border-radius:8px;
                padding:16px; width:min(720px,92vw); max-height:88vh; overflow:auto; }
  .modal .box h3 { margin:0 0 12px; }
  .modal .row { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }

  /* tree + detail (browse) */
  #tree { width:340px; flex:0 0 auto; overflow:auto; border-right:1px solid var(--line);
          padding:8px 0; }
  #detail { flex:1; overflow:auto; padding:16px 20px; }
  .node { padding:3px 10px; cursor:pointer; white-space:nowrap; user-select:none; }
  .node:hover { background:var(--panel); }
  .node.artist { font-weight:600; }
  .node.artist.sel { background:var(--accent); color:var(--on-accent); border-radius:3px; }
  .node.artist.sel .nodeact { color:var(--on-accent); }
  .nodeact { float:right; color:var(--muted); padding:0 6px; }
  .nodeact:hover { color:var(--accent); }
  .artisthead { margin-bottom:14px; }
  .artisthead h2 { margin:0 0 2px; font-size:20px; }
  .albumsection { margin-top:24px; }
  .albumsection:first-child { margin-top:0; }
  .albumhead { display:flex; gap:18px; align-items:flex-start; margin-bottom:16px; }
  .cover { width:200px; height:200px; object-fit:cover; background:var(--panel);
           border:1px solid var(--line); border-radius:6px; }
  .cover.editcover { cursor:pointer; }
  .cover.editcover:hover { border-color:var(--accent); }
  .albummeta h2 { margin:0 0 4px; font-size:18px; font-weight:600; }
  .albummeta .sub { color:var(--muted); min-height:20px; }
  .genrelink { cursor:pointer; }
  .genrelink:hover { color:var(--accent); text-decoration:underline; }
  /* Genre grid (click a genre to browse same-genre albums) */
  .genrehead .sortbar { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .genrehead .sortbtn { padding:3px 10px; font-size:12px; }
  .genrehead .sortbtn.active { background:var(--accent); color:var(--on-accent);
                               border-color:var(--accent); }
  .genregrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .gcard { position:relative; cursor:pointer; border-radius:6px; overflow:hidden; }
  .gcard img { width:100%; aspect-ratio:1; object-fit:cover; display:block;
               background:var(--panel); border:1px solid var(--line); border-radius:6px; }
  .gcard .gcap { position:absolute; left:0; right:0; bottom:0; padding:18px 8px 6px;
                 display:flex; flex-direction:column; gap:1px; opacity:0; transition:opacity .12s;
                 background:linear-gradient(transparent, rgba(0,0,0,.82)); color:#fff;
                 border-radius:0 0 6px 6px; pointer-events:none; }
  .gcard:hover .gcap { opacity:1; }
  .gcard .gcap b { font-size:12px; line-height:1.25; overflow:hidden; text-overflow:ellipsis;
                   display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .gcard .gcap span { font-size:11px; color:rgba(255,255,255,.75); overflow:hidden;
                      text-overflow:ellipsis; white-space:nowrap; }
  /* Fixed layout so columns line up across every album section. */
  table { width:100%; border-collapse:collapse; table-layout:fixed; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line);
           vertical-align:middle; overflow:hidden; text-overflow:ellipsis;
           white-space:nowrap; }
  th:first-child, td:first-child { width:64px; }
  th:last-child, td:last-child { width:84px; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  td .num { color:var(--muted); }
  .tdur { width:64px; text-align:right; font-variant-numeric:tabular-nums; }
  .draghandle { display:none; cursor:grab; color:var(--muted); user-select:none; }
  .draghandle:active { cursor:grabbing; }
  tr.dragging { opacity:.5; }
  /* Inline editable fields reuse the metrics of the static text they replace,
     using outline (no layout shift) instead of border, so Edit ≈ Browse. */
  input.tag, input.hdr { padding:0; border:0; border-radius:3px; line-height:inherit;
                         background:transparent; color:var(--fg); }
  input.tag { width:100%; }
  input.tag:hover, input.hdr:hover { outline:1px solid var(--line); outline-offset:-1px; }
  input.tag:focus, input.hdr:focus { outline:1px solid var(--accent); outline-offset:-1px;
                                     background:var(--bg); }
  input.tag.dirty { outline:1px solid var(--ok); outline-offset:-1px; }
  input.hdr.title { display:block; font-size:18px; font-weight:600; width:100%; margin:0 0 4px; }
  input.hdr.sub { display:inline-block; vertical-align:baseline; font-size:14px;
                  color:var(--muted); min-width:1ch; }
  /* Track playback affordances */
  tr.browserow { cursor:pointer; }
  tr.browserow:hover { background:var(--panel); }
  tr.playing td { color:var(--accent); }
  .rowplay { display:none; cursor:pointer; background:transparent; border:0;
             color:var(--muted); font:inherit; padding:0; }
  .rowplay:hover { color:var(--accent); }
  /* Browse: hover or the playing row swaps the number for the play icon. */
  tr.browserow:hover .rowplay, tr.browserow.playing .rowplay { display:inline; }
  tr.browserow:hover .num,     tr.browserow.playing .num     { display:none; }
  tr.browserow.playing .rowplay { color:var(--accent); }
  /* Edit/Import: hover swaps the number for the drag handle (no playback). */
  tr:has(.draghandle):hover .draghandle { display:inline; }
  tr:has(.draghandle):hover .num        { display:none; }

  /* generic page (audit, settings, job views) */
  .page { flex:1; overflow:auto; padding:16px 20px; }
  .page h2 { margin:0 0 12px; font-size:18px; }
  .field { display:flex; align-items:center; gap:10px; margin:8px 0; }
  .field label { min-width:280px; }
  /* Import drag-and-drop zone */
  .dropzone { border:2px dashed var(--line); border-radius:8px; padding:28px 16px;
              text-align:center; cursor:pointer; color:var(--muted);
              background:var(--panel); transition:border-color .15s, background .15s; }
  .dropzone:hover { border-color:var(--accent); }
  .dropzone.over { border-color:var(--accent); background:var(--code-bg); }
  .dropzone .dzbig { font-size:16px; color:var(--fg); margin-bottom:4px; }
  /* Inline import preview (edit-menu-style album sections) */
  .importpreview { margin-top:14px; border:1px solid var(--line); border-radius:8px;
                   padding:14px 16px; }
  .importpreview h3 { margin:0 0 4px; }
  .importpreview .albumsection { margin-top:20px; }
  /* Buttons stay pinned at the bottom while scrolling — just the buttons, no
     full-width bar behind them (they keep their own .btn backgrounds). */
  .previewactions { position:sticky; bottom:8px; display:flex; gap:8px;
                    justify-content:flex-end; margin-top:16px;
                    pointer-events:none; }
  .previewactions > * { pointer-events:auto; }
  /* Import cover slot: source/found image, searching shimmer, or placeholder. */
  .importcover { width:200px; height:200px; flex:0 0 auto; border:1px solid var(--line);
                 border-radius:6px; background:var(--panel); cursor:pointer; overflow:hidden;
                 display:flex; align-items:center; justify-content:center; position:relative; }
  .importcover img.cover { width:100%; height:100%; border:0; border-radius:0; }
  .importcover .covertext { color:var(--muted); font-size:13px; text-align:center; }
  .importcover.placeholder { border-style:dashed; }
  .importcover.shimmer { background:linear-gradient(90deg,var(--panel),var(--line),var(--panel));
                         background-size:200% 100%; animation:shimmer 1.2s ease-in-out infinite; }
  @keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
  input.needs { outline:1px solid var(--err); outline-offset:-1px; border-radius:3px; }
  .devicelist { display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 4px; }
  .devbtn { display:flex; gap:8px; align-items:center; }
  .devbtn svg { width:16px; height:16px; flex:0 0 auto; }
  .toggle { cursor:pointer; }
  .pill { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px;
          background:var(--panel); border:1px solid var(--line); color:var(--warn);
          margin-right:4px; }
  .card { border:1px solid var(--line); border-radius:6px; padding:10px 12px;
          margin-bottom:10px; }
  .card h4 { margin:0 0 6px; font-size:14px; }
  .log { font-family:ui-monospace, monospace; font-size:12px; white-space:pre-wrap;
         background:var(--code-bg); border:1px solid var(--line); border-radius:6px;
         padding:10px; height:50vh; overflow:auto; }
  .art { cursor:pointer; border:2px solid transparent; border-radius:6px; padding:4px;
         text-align:center; }
  .art:hover { border-color:var(--accent); }
  .art img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:4px;
             background:var(--panel); }
  .art .cap { font-size:11px; color:var(--muted); margin-top:4px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; }

  /* Back control: hidden by default, revealed by the phone @media block below
     (declared first so the media-query override wins at equal specificity). */
  .backbar { display:none; align-items:center; margin:-4px 0 10px; }
  .backbar button { gap:6px; }

  /* ── Phones / small screens ─────────────────────────────────────────────────
     Single-column, touch-first. Browse becomes master-detail (artist list ⇄
     album detail) toggled by the #view.show-detail class from tree.js. */
  @media (max-width: 760px) {
    /* Declutter the top into a single slim in-flow bar (above the content, not
       over it): back on the left (only on a detail page), search icon on the
       right. Title, file path and the theme toggle are dropped on mobile. */
    header { padding:calc(6px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right))
                     6px calc(10px + env(safe-area-inset-left));
             gap:8px; z-index:30; }
    header h1, header .root, header .modeToggle, #themeToggle, header .search { display:none; }
    .searchToggle { display:inline-flex; align-items:center; justify-content:center;
                    margin-left:auto; }   /* pinned to the right */
    .fab.backFab { font-size:22px; line-height:1; padding:2px 8px; }
    body.show-detail .fab.backFab { display:inline-flex; align-items:center; }

    /* Full-screen search overlay (app.js moves #search inside it). Large, centered,
       readable; only the small toggle icon shows when search is closed. */
    body.search-open #searchOverlay {
      display:block; position:fixed; inset:0; z-index:60; background:var(--bg);
      padding:calc(10px + env(safe-area-inset-top)) 12px 12px; }
    #searchOverlay #searchClose { position:absolute; z-index:1;
      top:calc(10px + env(safe-area-inset-top)); right:12px; }
    #searchOverlay .search { position:static; display:block; }
    /* Leave room for the ✕ on the input row; results below stay full width. */
    #searchOverlay #searchInput { width:calc(100% - 44px); font-size:16px; padding:10px 12px; }
    #searchOverlay .searchresults { position:static; margin:12px 0 0; min-width:0;
      max-width:none; max-height:calc(100dvh - 90px); box-shadow:none; }
    #searchOverlay .searchrow { padding:10px 12px; font-size:16px; }
    #searchOverlay .searchthumb { width:42px; height:42px; }

    /* Sidebar nav → horizontal scrolling top bar (kept for a trusted owner on a
       phone; hidden for guests, who only have the redundant 'Browse' tab). */
    body.guest nav.sidebar { display:none; }
    .layout { flex-direction:column; }
    /* Column layout: let #view shrink so the inner pane (#detail/#tree/.page)
       scrolls, not the body — keeping the player bar pinned at the bottom. */
    #view { min-height:0; }
    nav.sidebar { width:100%; flex:0 0 auto; display:flex; flex-direction:row;
                  overflow-x:auto; padding:0; border-right:0;
                  border-bottom:1px solid var(--line); }
    nav.sidebar button { width:auto; flex:0 0 auto; padding:10px 14px;
                         border-left:0; border-bottom:3px solid transparent; }
    nav.sidebar button.active { border-left-color:transparent;
                                border-bottom-color:var(--accent); }

    /* Browse master-detail: show the tree OR the detail, not both. */
    #view.browse #tree   { width:100%; flex:1 1 auto; }
    #view.browse #detail { display:none; }
    #view.browse.show-detail #tree   { display:none; }
    #view.browse.show-detail #detail { display:block; width:100%; flex:1 1 auto;
                                       padding:12px 14px; }
    .backbar { display:none; }   /* replaced by the back button in the top bar */

    /* Big cover wastes vertical space on a phone. */
    .albumhead { gap:12px; }
    .cover, .importcover { width:120px; height:120px; }
    .albummeta h2 { font-size:16px; }

    /* Drop the non-essential table columns so #, Title, Duration fit. */
    .browsetable th:nth-child(3), .browsetable td:nth-child(3),   /* Artist */
    .browsetable th:nth-child(5), .browsetable td:nth-child(5) {  /* Bitrate */
      display:none; }

    /* Player bar (mobile): row 1 = transport, title/artist (stacked), bitrate,
       album art pinned far right; row 2 = current time, seek, duration. */
    .player { flex-wrap:wrap; gap:4px 8px; padding:6px 10px; }
    .player .pmeta { display:flex; flex-direction:column; justify-content:center;
                     min-width:0; flex:1 1 0; order:2; }   /* basis 0 so a long title ellipsizes, not wraps */
    .player .ptitle { min-width:0; max-width:none; }
    .player .partist { display:block; min-width:0; overflow:hidden;
                       text-overflow:ellipsis; white-space:nowrap;
                       font-size:12px; color:var(--muted); }
    .player .pbitrate { display:inline-block; order:4; align-self:center; }
    .player .palbum { order:5; margin-left:auto; }   /* far right of the bar */
    .player .pseekrow { display:flex; align-items:center; gap:8px;
                        order:6; flex:1 1 100%; }
    .player .pseekrow .ptime { width:auto; min-width:40px; }
    /* Thin custom track + small thumb (appearance:none disables the native big
       white circle; it also drops accent-color's fill, so the thumb shows position). */
    .player .pseek { flex:1 1 auto; -webkit-appearance:none; appearance:none;
      height:4px; border-radius:2px; background:var(--line); }
    .player .pseek::-webkit-slider-thumb { -webkit-appearance:none; appearance:none;
      width:13px; height:13px; border-radius:50%; background:var(--accent); border:0; }
    .player .pseek::-moz-range-thumb { width:13px; height:13px; border-radius:50%;
      background:var(--accent); border:0; }
  }
</style>
</head>
<body>
<div id="bgLayer"><div id="bgImage"></div><div id="bgScrim"></div></div>
<header>
  <button class="fab backFab" id="backFab" title="Back to artists" aria-label="Back to artists">‹</button>
  <h1>mp3tools</h1>
  <span class="root" id="rootLabel"></span>
  <div class="search" id="search">
    <input id="searchInput" type="search" placeholder="Search albums &amp; tracks…" autocomplete="off">
    <div class="searchresults" id="searchResults"></div>
  </div>
  <div class="jobIndicator" id="jobIndicator"></div>
  <div class="modeToggle" id="modeToggle"></div>
  <button class="iconbtn searchToggle" id="searchToggle" title="Search" aria-label="Search">⌕</button>
  <button class="iconbtn" id="themeToggle" title="Toggle light/dark"></button>
</header>
<!-- Mobile full-screen search overlay: app.js moves #search in here on phones so it
     escapes the header's backdrop-filter containing block. Empty/hidden on desktop. -->
<div id="searchOverlay"><button class="iconbtn" id="searchClose" title="Close search" aria-label="Close search">✕</button></div>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <section id="view"></section>
</div>

<div class="player" id="player"></div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
