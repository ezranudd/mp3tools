[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mp3tools"
version = "1.0.0"
requires-python = ">=3.8"
dependencies = ["mutagen", "fastapi", "uvicorn"]

[project.optional-dependencies]
desktop = ["pywebview"]

[project.scripts]
mp3tools = "server:main"
mp3tools-web = "server:main"

[tool.setuptools]
py-modules = ["audit", "browse", "import_tracks", "standardize", "convert_lossless", "sync_library", "settings", "fetch_art", "rip_cd", "chars", "server", "webjobs", "webauth"]
